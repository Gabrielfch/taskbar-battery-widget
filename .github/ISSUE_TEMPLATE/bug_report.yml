name: Bug report
description: Something in the app does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Setup (installed)
        - Portable
        - Run from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt (optional)
      description: "From %LOCALAPPDATA%\\TaskbarBatteryWidget\\logs. Do not paste personal data."
      render: text
