name: Release

# Actions are pinned by major version (official actions only); the rest is plain shell + gh CLI.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write       # create the release and upload assets
      id-token: write       # sign provenance attestations
      attestations: write   # store provenance attestations
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve version and verify tag
        id: ver
        shell: pwsh
        run: |
          $version = (python -c "import taskbar_battery_widget as t; print(t.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Could not read __version__' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            # workflow_dispatch: only valid when run on an existing release tag ref
            throw 'Run this workflow from a tag ref (v<version>), not a branch.'
          }
          if ($tag -ne "v$version") { throw "Tag $tag does not match __version__ $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path -LiteralPath $_ }
          if (-not $found) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }
          }

      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -SkipTests

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/TaskbarBatteryWidget-Setup-${{ steps.ver.outputs.version }}.exe
            dist/TaskbarBatteryWidget-portable-${{ steps.ver.outputs.version }}.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $assets = @(
            "dist/TaskbarBatteryWidget-Setup-$env:VERSION.exe",
            "dist/TaskbarBatteryWidget-portable-$env:VERSION.exe",
            "dist/SHA256SUMS.txt"
          )
          $notes = "docs/release-notes/$env:TAG.md"
          $ghArgs = @('release', 'create', $env:TAG, '--title', $env:TAG, '--verify-tag') + $assets
          if (Test-Path -LiteralPath $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
