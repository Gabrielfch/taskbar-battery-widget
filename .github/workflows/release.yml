name: Release

# Official actions are pinned by full commit SHA (version in the trailing comment); the rest is plain shell + gh CLI.
# Two jobs: `build` compiles/tests with read-only permissions and hands the files over as an artifact;
# `publish` (the only one with write permissions) attests them and creates the release.
# The release is created as a DRAFT without SHA256SUMS.txt.sig: the maintainer signs it offline with
# tools/signing/sign_release.py <tag> --publish (see docs/release-notes/README.md).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read        # build and test only: no write access, no token usage
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve version and verify tag
        id: ver
        shell: pwsh
        run: |
          $version = (python -c "import taskbar_battery_widget as t; print(t.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Could not read __version__' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            # workflow_dispatch: only valid when run on an existing release tag ref
            throw 'Run this workflow from a tag ref (v<version>), not a branch.'
          }
          if ($tag -ne "v$version") { throw "Tag $tag does not match __version__ $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path -LiteralPath $_ }
          if (-not $found) {
            # pinned: 6.7.1 is the newest 6.x on Chocolatey (6.22.3 does not exist there)
            choco install innosetup --version 6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }
          }

      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -SkipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/TaskbarBatteryWidget-Setup-${{ steps.ver.outputs.version }}.exe
            dist/TaskbarBatteryWidget-portable-${{ steps.ver.outputs.version }}.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the draft release and upload assets
      id-token: write       # sign provenance attestations
      attestations: write   # store provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false      # only needed for docs/release-notes

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Check artifact integrity
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          foreach ($n in @("TaskbarBatteryWidget-Setup-$env:VERSION.exe", "TaskbarBatteryWidget-portable-$env:VERSION.exe")) {
            $line = Select-String -LiteralPath dist/SHA256SUMS.txt -Pattern ([regex]::Escape($n) + '$')
            if (@($line).Count -ne 1) { throw "$n is not listed exactly once in SHA256SUMS.txt" }
            $want = ($line.Line -split '\s+')[0].ToLower()
            $got = (Get-FileHash -LiteralPath "dist/$n" -Algorithm SHA256).Hash.ToLower()
            if ($want -ne $got) { throw "Hash mismatch for $n after artifact transfer" }
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/TaskbarBatteryWidget-Setup-${{ needs.build.outputs.version }}.exe
            dist/TaskbarBatteryWidget-portable-${{ needs.build.outputs.version }}.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}   # only this step talks to the GitHub API with the token
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $assets = @(
            "dist/TaskbarBatteryWidget-Setup-$env:VERSION.exe",
            "dist/TaskbarBatteryWidget-portable-$env:VERSION.exe",
            "dist/SHA256SUMS.txt"
          )
          $notes = "docs/release-notes/$env:TAG.md"
          $ghArgs = @('release', 'create', $env:TAG, '--title', $env:TAG, '--verify-tag', '--draft') + $assets
          if (Test-Path -LiteralPath $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
